apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: miftah-bank

resources:
  - namespace.yaml
  - secrets.yaml
  - redis.yaml
  - postgres.yaml
  - backend.yaml
  - frontend.yaml
  - load-balancer.yaml
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: miftah-bank
    includeSelectors: false
    includeTemplates: true

# Using a registry (for example ghcr.io)? Change the image name and tag here, no need to edit the manifests:
# images:
#   - name: miftah-bank/backend
#     newName: ghcr.io/rezadeb/miftah-bank-backend
#     newTag: "1.0.0"
