# K3s includes Traefik as the default Ingress controller.
# If the load-balancer pod is down, the Service has no endpoints, so Traefik answers HTTP 503 (Service Unavailable).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: miftah-bank
  namespace: miftah-bank
  labels:
    app.kubernetes.io/name: miftah-bank
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: load-balancer
                port:
                  number: 80
