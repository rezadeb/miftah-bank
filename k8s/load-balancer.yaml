# Load balancer: nginx (supported by the OneAgent NGINX module)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-balancer
  namespace: miftah-bank
  labels:
    app.kubernetes.io/name: load-balancer
    app.kubernetes.io/component: load-balancer
    app.kubernetes.io/version: "1.0.2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: load-balancer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: load-balancer
        app.kubernetes.io/component: load-balancer
        app.kubernetes.io/version: "1.0.2"
    spec:
      containers:
        - name: nginx
          image: miftah-bank/load-balancer:1.0.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: FRONTEND_UPSTREAM
              value: frontend:3000
            # static  = nginx resolves the frontend name once at start-up. OneAgent can record the
            #           nginx -> frontend call, so the link shows in the Dynatrace Map.
            # dynamic = nginx resolves the name on every request (the old behavior).
            - name: FRONTEND_PROXY_MODE
              value: static
          readinessProbe:
            httpGet: { path: /nginx-health, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /nginx-health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: load-balancer
  namespace: miftah-bank
  labels:
    app.kubernetes.io/name: load-balancer
spec:
  selector:
    app.kubernetes.io/name: load-balancer
  ports:
    - name: http
      port: 80
      targetPort: http
