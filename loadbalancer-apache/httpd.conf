# ============================================================================
# Miftah Bank - Load Balancer (Apache httpd 2.4)   <-- EXPERIMENT
#
#   Browser -> Ingress -> Apache :8080 -> frontend :3000 (Node.js)
#
# Why this exists: with nginx, OneAgent records the trace (the frontend span has the nginx span as
# its parent) but it does not create a "client" span, so the Dynatrace Map has no line from the
# load balancer to the frontend. This variant uses Apache httpd (mod_proxy) to find out whether
# OneAgent records the outgoing call and draws the line.
#
# The upstream comes from the environment variable FRONTEND_UPSTREAM (default frontend:3000).
# Apache uses the normal system resolver, so a short Service name like "frontend" works
# (the search domains in /etc/resolv.conf are used).
#
# What users see when something is down (same behavior as the nginx version):
#   - Frontend pod is down  -> Apache answers HTTP 503 (an HTML page, or JSON for /api/).
#   - Frontend is up but backend, Redis or PostgreSQL is down
#                           -> the 503 from the frontend is passed through unchanged
#                              (ProxyErrorOverride stays Off).
#   - This Apache pod is down -> the HTTP 503 comes from the Ingress.
#
# This file is made for the official "httpd" Docker image (ServerRoot /usr/local/apache2).
# ============================================================================

ServerRoot "/usr/local/apache2"
Listen 8080
ServerName load-balancer
ServerTokens Prod
ServerSignature Off
User daemon
Group daemon

# Only the modules we need.
LoadModule mpm_event_module  modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule mime_module       modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule setenvif_module   modules/mod_setenvif.so
LoadModule headers_module    modules/mod_headers.so
LoadModule unixd_module      modules/mod_unixd.so
LoadModule alias_module      modules/mod_alias.so
LoadModule proxy_module      modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

PidFile logs/httpd.pid
Timeout 60
KeepAlive On
KeepAliveTimeout 5

# Logs go to the container output (kubectl logs).
ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h [%{%d/%b/%Y:%H:%M:%S %z}t] \"%r\" %>s %B rt=%{ms}Tms" miftah
SetEnvIf Request_URI "^/apache-health$" nolog
CustomLog /proc/self/fd/1 miftah env=!nolog

<Directory />
    AllowOverride None
    Require all denied
</Directory>

# Files served by Apache itself: the health check and the error pages.
DocumentRoot "/usr/local/apache2/htdocs-miftah"
<Directory "/usr/local/apache2/htdocs-miftah">
    AllowOverride None
    Options None
    Require all granted
</Directory>

# conf/mime.types comes with the official httpd image.
TypesConfig conf/mime.types
AddType application/json .json
AddDefaultCharset UTF-8

Alias /apache-health "/usr/local/apache2/htdocs-miftah/health.txt"
<Location "/apache-health">
    ForceType text/plain
</Location>

<Location "/errors/">
    Header always set Cache-Control "no-store"
</Location>

# When the frontend cannot be reached, Apache itself creates 502/503/504.
# These pages replace them. A 503 sent BY the frontend is not changed (ProxyErrorOverride is Off).
ErrorDocument 502 /errors/frontend-unavailable.html
ErrorDocument 503 /errors/frontend-unavailable.html
ErrorDocument 504 /errors/frontend-unavailable.html
<Location "/api/">
    ErrorDocument 502 /errors/frontend-unavailable.json
    ErrorDocument 503 /errors/frontend-unavailable.json
    ErrorDocument 504 /errors/frontend-unavailable.json
</Location>

# ---- Reverse proxy to the frontend ----
ProxyRequests Off
ProxyPreserveHost On
ProxyErrorOverride Off

# These paths are answered by Apache itself. They must come BEFORE the "/" rule.
ProxyPass /apache-health !
ProxyPass /errors/ !

# connectiontimeout=2 / timeout=30 match the nginx version (2s connect, 30s read).
ProxyPass        / http://${FRONTEND_UPSTREAM}/ connectiontimeout=2 timeout=30
ProxyPassReverse / http://${FRONTEND_UPSTREAM}/

# mod_proxy adds X-Forwarded-For / -Host / -Server by itself. Add the scheme like nginx did.
RequestHeader set X-Forwarded-Proto "expr=%{REQUEST_SCHEME}"
