<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Miftah Bank - Login</title>
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <main class="login-wrap">
    <section class="login-card">
      <div class="brand">
        <div class="brand-logo">M</div>
        <div class="brand-name">Miftah Bank</div>
      </div>
      <p class="login-sub">Masuk untuk melihat saldo dan transfer uang.</p>

      <form id="login-form" autocomplete="off">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="mis. demo" required autofocus>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Password" required>

        <button type="submit" class="btn btn-block" id="btn-login">Login</button>
      </form>

      <div id="alert" class="alert" role="alert"></div>

      <p class="hint">Akun demo: <code>demo</code> / <code>demo123</code></p>
    </section>
  </main>
  <script type="module" src="/assets/js/login.js"></script>
</body>
</html>
