<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Miftah Bank - Beranda</title>
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo">M</div>
      <div class="brand-name">Miftah Bank</div>
    </div>
    <div class="userbox">
      <div>
        <div id="user-name">-</div>
        <div class="acct" id="user-acct"></div>
      </div>
      <button type="button" class="btn btn-ghost" id="btn-logout">Logout</button>
    </div>
  </header>

  <main class="container">
    <div id="alert" class="alert" role="alert"></div>

    <div class="grid" style="margin-top: 18px;">
      <section class="card">
        <h2>Cek Saldo</h2>
        <p class="sub">Lihat saldo rekening Anda saat ini.</p>
        <button type="button" class="btn" id="btn-balance">Cek Saldo</button>
        <div class="balance" id="balance-box" hidden>
          <div class="label">Saldo Anda</div>
          <div class="value" id="balance-value">Rp 0</div>
          <div class="asof" id="balance-asof"></div>
        </div>
      </section>

      <section class="card">
        <h2>Transfer Uang</h2>
        <p class="sub">Isi nominal, saldo akan bertambah dan transaksi tercatat di riwayat.</p>
        <form id="transfer-form" autocomplete="off">
          <label for="amount" style="margin-top: 0;">Nominal (Rp)</label>
          <input type="number" id="amount" name="amount" min="1" step="1" placeholder="mis. 100000" required>
          <div class="chips">
            <button type="button" class="chip" data-amount="10000">Rp 10.000</button>
            <button type="button" class="chip" data-amount="100000">Rp 100.000</button>
            <button type="button" class="chip" data-amount="500000">Rp 500.000</button>
            <button type="button" class="chip" data-amount="1000000">Rp 1.000.000</button>
          </div>
          <button type="submit" class="btn btn-block" id="btn-transfer">Transfer Uang</button>
        </form>
      </section>

      <section class="card wide">
        <div class="head-row">
          <div>
            <h2>Riwayat Transaksi</h2>
            <p class="sub" style="margin-bottom: 0;">20 transaksi terbaru (waktu WIB).</p>
          </div>
          <button type="button" class="btn btn-secondary" id="btn-refresh">Muat Ulang</button>
        </div>
        <div id="history-alert" class="alert" role="alert"></div>
        <table style="margin-top: 12px;">
          <thead>
            <tr>
              <th>ID</th>
              <th>Tanggal</th>
              <th>Jam</th>
              <th class="num">Jumlah</th>
              <th class="num">Saldo Setelah</th>
            </tr>
          </thead>
          <tbody id="history-body">
            <tr><td colspan="5" class="empty">Memuat...</td></tr>
          </tbody>
        </table>
      </section>
    </div>
  </main>
  <script type="module" src="/assets/js/home.js"></script>
</body>
</html>
