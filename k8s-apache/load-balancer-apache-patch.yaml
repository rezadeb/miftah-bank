# JSON patch (RFC 6902). It swaps the nginx container for the Apache container.
- op: replace
  path: /metadata/labels/app.kubernetes.io~1version
  value: "1.0.0"
- op: replace
  path: /spec/template/metadata/labels/app.kubernetes.io~1version
  value: "1.0.0"
- op: replace
  path: /spec/template/spec/containers
  value:
    - name: apache
      image: miftah-bank/load-balancer-apache:1.0.0
      imagePullPolicy: IfNotPresent
      ports:
        - name: http
          containerPort: 8080
      env:
        - name: FRONTEND_UPSTREAM
          value: frontend:3000
      readinessProbe:
        httpGet: { path: /apache-health, port: http }
        initialDelaySeconds: 2
        periodSeconds: 5
      livenessProbe:
        httpGet: { path: /apache-health, port: http }
        initialDelaySeconds: 5
        periodSeconds: 10
      resources:
        requests:
          cpu: 50m
          memory: 96Mi
        limits:
          cpu: 300m
          memory: 256Mi
