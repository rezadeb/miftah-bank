name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Java 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build + unit test
        run: mvn -B -f backend/pom.xml verify

  frontend:
    name: Frontend (Node.js 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install + syntax check
        working-directory: frontend
        run: |
          npm ci
          node --check server.js
          for f in public/js/*.js; do node --check "$f"; done

  images:
    name: Docker build (tanpa push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t miftah-bank/backend:ci backend
      - run: docker build -t miftah-bank/frontend:ci frontend
      - run: docker build -t miftah-bank/load-balancer:ci loadbalancer
