name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Java 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build + unit test
        run: mvn -B -f backend/pom.xml verify

  frontend:
    name: Frontend (Node.js 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install + syntax check
        working-directory: frontend
        run: |
          npm ci
          node --check server.js
          for f in public/js/*.js; do node --check "$f"; done

  images:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t miftah-bank/backend:ci backend
      - run: docker build -t miftah-bank/frontend:ci frontend
      - run: docker build -t miftah-bank/load-balancer:ci loadbalancer
      - run: docker build -t miftah-bank/load-balancer-apache:ci loadbalancer-apache

  loadgen:
    name: Locust files (syntax check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r loadgen/requirements.txt
      - name: Check that Locust can load both locustfiles
        working-directory: loadgen
        run: |
          python -m py_compile locustfile.py locustfile_wave.py
          locust -f locustfile.py --list
          locust -f locustfile_wave.py --list
      - name: Check Kubernetes manifests render
        run: |
          kubectl kustomize k8s > /dev/null
          kubectl kustomize loadgen > /dev/null
          kubectl kustomize k8s-dockerhub > /dev/null
          kubectl kustomize k8s-apache | grep -q 'miftah-bank-load-balancer-apache'
